<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Management System</title>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body{
            background:#f8f9fa;
        }

        .accordion-button:not(.collapsed){
            background:#0d6efd;
            color:#fff;
        }

        .accordion-button:focus{
            box-shadow:none;
        }

        .list-group-item:hover{
            background:#0d6efd !important;
            color:#fff !important;
            transition:.3s;
        }

    </style>


<style>

.routine-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;

    border:1px solid #000;
    background:#fff;

    padding:10px 15px;
    margin-bottom:10px;

    font-size:14px;
}

.info-left{
    text-align:left;
}

.info-center{
    text-align:center;
}

.info-right{
    text-align:right;
}


/* =========================================================
   PRINT CSS
   ========================================================= */

@media print {

    @page {
        size: A4 landscape;
        margin: 8mm;
    }


    html,
    body {
        margin: 0 !important;
        padding: 0 !important;

        height: auto !important;

        overflow: visible !important;
    }


    /* =====================================================
       Hide normal website elements
       ===================================================== */

    body * {
        visibility: hidden !important;
    }


    /* =====================================================
       ROUTINE PRINT
       ===================================================== */

    #routine-print-area,
    #routine-print-area * {

        visibility: visible !important;
    }

    #routine-print-area {

        position: absolute !important;

        top: 0 !important;
        left: 0 !important;

        width: 100% !important;

        height: auto !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;
    }


    /* =====================================================
       ASSIGNMENT PRINT
       ===================================================== */

    #assignment-print-area,
    #assignment-print-area * {

        visibility: visible !important;
    }

    #assignment-print-area {

        position: absolute !important;

        top: 0 !important;
        left: 0 !important;

        width: 100% !important;

        height: auto !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;

        display: block !important;
    }


    /* =====================================================
       Hide buttons / filters during print
       ===================================================== */

    .no-print {

        display: none !important;

        visibility: hidden !important;
    }


    #routine-print-area form,
    #routine-print-area button,
    #routine-print-area .btn {

        display: none !important;
    }


    #assignment-print-area .action-column {

        display: none !important;
    }


    /* =====================================================
       TABLE RESPONSIVE
       ===================================================== */

    .table-responsive {

        overflow: visible !important;

        display: block !important;

        width: 100% !important;
    }


    /* =====================================================
       ROUTINE TABLE
       ===================================================== */

    .routine-table {

        width: 100% !important;

        margin: 0 !important;

        page-break-after: avoid !important;

        break-after: avoid-page !important;
    }


    .routine-table th,
    .routine-table td {

        padding: 3px !important;

        height: 45px !important;

        min-width: 0 !important;
    }


    .routine-table thead th,
    .routine-table thead th div,
    .routine-table thead th small {

        color: #000 !important;
    }


    .signature-area {

        margin-top: 50px !important;

        page-break-after: avoid !important;

        break-after: avoid-page !important;
    }


    /* =====================================================
       ASSIGNMENT TABLE
       ===================================================== */

    #assignment-print-area table {

        display: table !important;

        visibility: visible !important;

        width: 100% !important;

        max-width: 100% !important;

        margin: 0 !important;

        border-collapse: collapse !important;

        border-spacing: 0 !important;
    }


    #assignment-print-area thead {

        display: table-header-group !important;

        visibility: visible !important;
    }


    #assignment-print-area tbody {

        display: table-row-group !important;

        visibility: visible !important;
    }


    #assignment-print-area tr {

        display: table-row !important;

        visibility: visible !important;

        page-break-inside: avoid !important;

        break-inside: avoid !important;
    }


    #assignment-print-area th,
    #assignment-print-area td {

        display: table-cell !important;

        visibility: visible !important;

        color: #000 !important;

        background: #fff !important;

        border: 1px solid #000 !important;

        padding: 5px !important;

        font-size: 11px !important;

        vertical-align: middle !important;
    }


    #assignment-print-area th {

        background: #e9e9e9 !important;

        font-weight: bold !important;

        text-align: center !important;
    }


    /* =====================================================
       ASSIGNMENT PRINT HEADER
       ===================================================== */

    #assignment-print-area .print-header {

        display: block !important;

        visibility: visible !important;

        text-align: center !important;

        margin-bottom: 15px !important;
    }


    #assignment-print-area .print-header h3 {

        display: block !important;

        visibility: visible !important;

        color: #000 !important;

        font-size: 20px !important;

        margin: 0 0 5px 0 !important;
    }


    #assignment-print-area .print-header p {

        display: block !important;

        visibility: visible !important;

        color: #000 !important;

        font-size: 14px !important;

        margin: 0 0 15px 0 !important;
    }


    /* =====================================================
       STATUS BADGE
       ===================================================== */

    #assignment-print-area .badge {

        color: #000 !important;

        background: transparent !important;

        padding: 0 !important;

        border: none !important;
    }

}

</style>



    {% block extra_css %}
    {% endblock %}

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="{% url 'student_list' %}">

            School Name

        </a>

        <div class="d-flex align-items-center">

            {% if request.user.is_authenticated %}

                <span class="text-white me-3">

                    Welcome,
                    <strong>{{ request.user.username }}</strong>

                </span>

                <form
                    action="{% url 'logout' %}"
                    method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</nav>

<!-- ================= CONTENT ================= -->

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        {% include "sidebar.html" %}

        <!-- Main Content -->

        <main class="col-md-9 col-lg-10 py-3">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>


<!-- Bootstrap -->
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- Django Messages -->

{% if messages %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    {% for message in messages %}

    Swal.fire({

        icon: "{% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",

        title: "{{ message|escapejs }}",

        toast: true,

        position: "top-end",

        showConfirmButton: false,

        timer: 2500,

        timerProgressBar: true

    });

    {% endfor %}

});

</script>

{% endif %}

{% block extra_js %}
{% endblock %}

</body>

</html>
