<form method="GET" class="mb-3">

    <div class="input-group">

        <input

            type="text"

            name="q"

            class="form-control"

            placeholder="{{ placeholder }}"

            value="{{ request.GET.q }}">

        <button

            class="btn btn-primary"

            type="submit">

            <i class="bi bi-search"></i>

            Search

        </button>

    </div>

</form>
