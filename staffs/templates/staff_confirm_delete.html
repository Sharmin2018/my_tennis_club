
{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-danger text-white">

                <h4>Delete Staff</h4>

            </div>

            <div class="card-body">

                <h5>

                    Are you sure you want to delete

                    <strong>

                        {{ object.name }}

                    </strong>?

                </h5>

                <form method="POST">

                    {% csrf_token %}

                    <a href="{% url 'staff_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Delete

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
